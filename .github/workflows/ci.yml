name: ARC CI

on:
  push:
    branches:
      - arc-v1-foundation
  pull_request:
    branches:
      - main
      - arc-v1-foundation

permissions:
  contents: read

concurrency:
  group: arc-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Worker Docker build
        run: docker build --file apps/worker/Dockerfile --tag arc-worker:ci .
