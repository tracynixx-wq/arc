name: Render keep-alive ping

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        env:
          RENDER_URL: https://arc-zh7i.onrender.com
        run: |
          curl --fail --silent --show-error --max-time 20 "${RENDER_URL}/" >/dev/null
