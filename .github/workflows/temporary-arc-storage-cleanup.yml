name: Temporary ARC storage cleanup
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-arc-storage-cleanup.yml"
permissions:
  contents: read
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Delete ARC objects from Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          node <<'NODE'
          const base = (process.env.SUPABASE_URL || '').replace(/\\/$/, '');
          const key = process.env.SUPABASE_KEY || '';
          if (!base || !key) throw new Error('Missing SUPABASE_URL or SUPABASE_KEY repository secret');
          async function request(path, method, body) {
            const res = await fetch(base + path, {
              method,
              headers: { apikey: key, Authorization: 'Bearer ' + key, 'Content-Type': 'application/json' },
              body: body === undefined ? undefined : JSON.stringify(body)
            });
            const raw = await res.text();
            if (!res.ok) throw new Error(method + ' ' + path + ' failed: ' + res.status + ' ' + raw);
            return raw ? JSON.parse(raw) : null;
          }
          async function listFiles(bucket, prefix = '') {
            const items = await request('/storage/v1/object/list/' + bucket, 'POST', {
              prefix, limit: 1000, offset: 0, sortBy: { column: 'name', order: 'asc' }
            });
            const files = [];
            for (const item of items) {
              if (item.id == null && !item.metadata) {
                files.push(...await listFiles(bucket, prefix + item.name + '/'));
              } else {
                files.push(prefix + item.name);
              }
            }
            return files;
          }
          (async () => {
            for (const bucket of ['arc-covers', 'arc-originals']) {
              const paths = await listFiles(bucket);
              console.log(bucket + ': found ' + paths.length + ' objects');
              for (let i = 0; i < paths.length; i += 100) {
                await request('/storage/v1/object/' + bucket, 'DELETE', { prefixes: paths.slice(i, i + 100) });
              }
              console.log(bucket + ': deleted ' + paths.length + ' objects');
            }
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
