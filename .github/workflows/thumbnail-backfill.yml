name: ARC thumbnail backfill

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RUN to process pending video covers
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: arc-thumbnail-backfill
  cancel-in-progress: false

jobs:
  backfill:
    if: github.event.inputs.confirm == 'RUN'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Process pending animated covers
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          PASSWORD: ${{ secrets.PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python backfill_runner.py
