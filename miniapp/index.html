<style>
:root{color-scheme:dark;--bg:#101116;--surface:#191a22;--surface2:#22232d;--line:#2c2d38;--text:#f4f4f7;--muted:#9294a3;--accent:#a98dff;--danger:#ff7180}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 13px calc(18px + env(safe-area-inset-bottom))}
button,input{font:inherit}button{border:0;color:inherit;cursor:pointer}.top{height:54px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);margin-bottom:17px}.brand{display:flex;align-items:center;gap:9px;font-weight:850;letter-spacing:1.6px}.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(145deg,#c0aaff,#7052c8);display:grid;place-items:center;color:#171321;font-size:17px}.sub{font-size:9px;color:var(--muted);letter-spacing:1px;margin-top:2px}.avatar{width:30px;height:30px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;color:var(--accent);font-weight:700}
h1{font-size:23px;line-height:1.15;letter-spacing:-.5px;margin:3px 0 4px}.muted{color:var(--muted)}.intro{display:flex;justify-content:space-between;align-items:end}.intro .muted{font-size:12px}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.tile{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:11px 9px;text-align:left;min-height:82px}.tile:active,.action:active,.smallbtn:active{transform:scale(.98)}.tile .ico{font-size:18px;margin-bottom:8px}.tile strong{display:block;font-size:12px}.tile small{display:block;color:var(--muted);font-size:10px;margin-top:3px;white-space:nowrap}
.action{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin:6px 0;text-align:left;font-size:12px}.action strong{color:var(--accent);font-weight:650}
.toolbar{display:flex;gap:7px;margin:12px 0 9px}.search{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 12px;color:var(--text);outline:none}.smallbtn{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:11px}.back{background:transparent;color:var(--accent);padding:7px 0 10px;font-weight:650;font-size:12px}
.masonry{columns:2;column-gap:7px;margin-top:8px}.pin{position:relative;display:inline-block;width:100%;break-inside:avoid;margin:0 0 7px;padding:0;background:transparent;border:0;border-radius:0;overflow:hidden;vertical-align:top}.pin-media,.pin-video{display:block;width:100%;height:auto;max-height:none;object-fit:contain;background:transparent;border:0;border-radius:0}.pin-video{aspect-ratio:auto;object-fit:cover}.pin-circle{aspect-ratio:1/1!important;object-fit:cover!important}.pin-cover-wrap{position:relative;aspect-ratio:4/5;overflow:hidden;background:#17151e}.pin-cover-wrap.pin-circle{aspect-ratio:1/1}.pin-cover-wrap.pin-animation{aspect-ratio:3/4}.pin-cover-wrap.pin-document{aspect-ratio:4/5}.pin-cover-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}.pin-cover-img.cover-failed{display:none}.pin-cover-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;background:linear-gradient(145deg,#282536,#101116);color:#fff}.pin-cover-fallback small{font-size:9px;letter-spacing:1.2px;color:#d4d0df}.pin-cover-wrap.pin-document .pin-cover-fallback{background:linear-gradient(145deg,#302b3b,#17151e)}.pin-cover-wrap.pin-animation .pin-cover-fallback{background:linear-gradient(145deg,#3b2945,#17131f)}.pin-video-placeholder{aspect-ratio:4/5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;background:linear-gradient(145deg,#282536,#101116);color:#fff}.pin-video-placeholder.pin-circle{aspect-ratio:1/1}.pin-video-placeholder.pin-animation{aspect-ratio:3/4;background:linear-gradient(145deg,#3b2945,#17131f)}.play-mark{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18);font-size:17px;padding-left:3px}.pin-video-placeholder small{font-size:9px;letter-spacing:1.2px;color:#d4d0df}.pin-overlay{position:absolute;left:0;right:0;bottom:0;padding:24px 7px 7px;background:linear-gradient(transparent,rgba(0,0,0,.78));display:flex;align-items:end;justify-content:space-between;gap:4px;opacity:0;transition:opacity .15s}.pin:active .pin-overlay,.pin:hover .pin-overlay{opacity:1}.pin-title{font-size:10px;font-weight:700;color:white;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pin-actions{display:flex;gap:4px;flex-shrink:0}.pin-actions .smallbtn{padding:5px 6px;font-size:9px;background:rgba(20,20,25,.82);border:0}.pin-doc{aspect-ratio:4/5;display:grid;place-items:center;font-size:35px;background:linear-gradient(145deg,#29243b,#14151d);color:#fff}.pin-doc small{display:block;font-size:10px;color:#c9c4d9;margin-top:7px}.delete{color:#ff8792}.download{color:var(--accent);text-decoration:none;font-size:10px}.load-more{text-align:center;color:var(--muted);font-size:11px;padding:15px}.file{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:9px;margin:7px 0;min-width:0}.thumb{width:76px;height:64px;flex:0 0 76px;border-radius:9px;background:#0b0c11;object-fit:cover}.circle-file{flex-direction:column;align-items:stretch;padding:12px}.circle-file .thumb{width:min(100%,320px);height:auto;aspect-ratio:1/1;flex:none;align-self:center;object-fit:contain}.circle-file .file-main{width:100%}.circle-file .file-name{font-size:14px}.circle-file .file-meta{font-size:11px}.file-main{min-width:0;flex:1}.file-name{font-size:12px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file-meta{font-size:10px;color:var(--muted);margin-top:5px}.file-actions{display:flex;gap:5px;margin-top:7px}.file-actions .smallbtn{padding:6px 8px;font-size:10px}.preview-wrap{width:100%;margin:5px 0 0}.preview{display:block;width:100%;max-height:250px;object-fit:contain;border-radius:9px;background:#090a0d}
.nav{display:flex;justify-content:space-between;align-items:center;margin:13px 0}.empty{text-align:center;padding:30px 12px;color:var(--muted);font-size:12px}.hidden{display:none!important}.primary{background:var(--accent);color:#171321;font-weight:750;border-radius:11px;padding:12px;width:100%;margin-top:10px}.input{width:100%;padding:13px;border-radius:11px;background:var(--surface);border:1px solid var(--line);color:var(--text);outline:none;margin-top:15px}.error{color:var(--danger);font-size:11px;margin-top:9px}.viewer{position:fixed;inset:0;z-index:50;background:rgba(5,5,9,.97);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));}.viewer-head,.viewer-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}.viewer-head{min-height:42px}.viewer-name{font-size:12px;color:var(--muted)}.viewer-stage{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;padding:12px 0}.viewer-stage img,.viewer-stage video{max-width:100%;max-height:100%;object-fit:contain}.viewer-stage iframe{width:100%;height:100%;border:0;background:#fff}.viewer-actions{justify-content:center;flex-wrap:wrap}.viewer-actions button{min-width:76px;padding:11px 13px;border-radius:11px;background:var(--surface2);font-size:12px}.viewer-actions .danger{color:var(--danger)}.viewer-nav{display:flex;justify-content:space-between;align-items:center;padding:8px 0}.viewer-nav button{background:transparent;color:var(--accent);padding:8px;font-size:12px}.footer{text-align:center;color:#686a78;font-size:9px;margin:22px 0 8px}
@media(min-width:520px){body{max-width:560px;margin:0 auto}.tiles{gap:9px}.tile{min-height:90px;padding:13px}}

/* Profile, filters and lightweight motion previews */
:root{--accent:#a98dff}
body[data-theme="light"]{color-scheme:light;--bg:#f4f3f8;--surface:#fff;--surface2:#eceaf3;--line:#dedbe8;--text:#24212d;--muted:#777383}
body[data-density="compact"] .tile{min-height:68px;padding:8px}
body[data-density="compact"] .stat{padding:7px 9px}
.profile-card{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:14px;margin:12px 0}
.profile-label{display:block;color:var(--muted);font-size:10px;margin:12px 0 6px}
.profile-input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);outline:none}
.choice-row{display:flex;gap:7px;flex-wrap:wrap}
.choice{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);font-size:11px}
.choice.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.swatch{width:29px;height:29px;border-radius:50%;border:2px solid transparent}
.swatch.active{outline:2px solid var(--text);outline-offset:2px}
.filter-row{display:flex;gap:6px;overflow-x:auto;padding:2px 0 7px;scrollbar-width:none}
.filter-row .choice{white-space:nowrap;flex-shrink:0;padding:7px 10px}
.pin-preview{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;background:#17151e}
.pin-preview.circle{aspect-ratio:1/1}
.pin-favorite{position:absolute;top:6px;right:6px;z-index:2;width:27px;height:27px;border-radius:50%;background:rgba(12,12,17,.72);color:#fff;font-size:14px}
.pin-favorite.active{color:#ff8db1}
.viewer-actions .favorite{color:var(--accent)}
#avatar{border:0;cursor:pointer}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="logo">A</div><div>ARC<div class="sub">PRIVATE MEDIA VAULT</div></div></div><button class="avatar" id="avatar" aria-label="Профиль">A</button></header>
<main id="app">
<section id="login" class="hidden"><h1>Доступ к архиву</h1><div class="muted">Введи пароль для продолжения</div><input id="password" class="input" type="password" placeholder="Пароль"><button class="primary" id="unlock">Открыть архив</button><div id="loginError" class="error"></div></section>
<section id="home">
<div class="intro"><div><div class="muted" id="greeting">Личное хранилище</div><h1>Медиатека</h1></div><div class="muted" style="font-size:10px">ЛИЧНЫЙ АРХИВ</div></div>
<div class="stats"><div class="stat"><div class="num" id="total">—</div><div class="label">ВСЕГО</div></div><div class="stat"><div class="num" id="videos">—</div><div class="label">ВИДЕО</div></div><div class="stat"><div class="num" id="other">—</div><div class="label">ДРУГОЕ</div></div></div>
<div class="section-title">Разделы <small>выбери коллекцию</small></div>
<div class="tiles">
<button class="tile" data-section="favorites"><div class="ico">♥</div><strong>Избранное</strong><small id="count-favorites">Сохранённые файлы</small></button>
<button class="tile" data-section="videos"><div class="ico">🎬</div><strong>Видео</strong><small id="count-videos">— файлов</small></button>
<button class="tile" data-section="circles"><div class="ico">⭕</div><strong>Кружки</strong><small id="count-circles">— файлов</small></button>
<button class="tile" data-section="leaks"><div class="ico">✦</div><strong>Другое</strong><small id="count-leaks">— файлов</small></button>
</div>
<div class="section-title">Быстрые настройки</div>
<button class="action" id="modeBtn"><span>📥 Режим сохранения</span><strong id="modeLabel">Авто　›</strong></button>
<button class="action" id="refreshBtn"><span>↻ Обновить архив</span><span class="muted">›</span></button>
<button class="action" id="profileBtn"><span>👤 Профиль и оформление</span><strong>›</strong></button>
</section>
<section id="library" class="hidden">
<button class="back" id="backHome">‹ Назад к медиатеке</button>
<div class="intro"><div><div class="muted" style="font-size:11px">КОЛЛЕКЦИЯ</div><h1 id="libraryTitle">Архив</h1></div><span class="muted" id="totalLabel" style="font-size:10px"></span></div>
<div class="toolbar"><input id="filter" class="search" placeholder="Поиск по названию файла"><button class="smallbtn" id="reloadSection">↻</button></div>
<div class="filter-row" id="kindFilters"><button class="choice active" data-kind-filter="">Все</button><button class="choice" data-kind-filter="photo">Фото</button><button class="choice" data-kind-filter="video">Видео</button><button class="choice" data-kind-filter="animation">GIF</button><button class="choice" data-kind-filter="video_note">Кружки</button></div>
<div id="files"></div>
<div class="nav"><button class="smallbtn" id="prev">← Назад</button><span class="muted" id="pageLabel" style="font-size:10px"></span><button class="smallbtn" id="next">Далее →</button></div>
</section>
<section id="profile" class="hidden">
<button class="back" id="profileBack">‹ Назад к медиатеке</button>
<div class="intro"><div><div class="muted" style="font-size:11px">ЛИЧНЫЕ НАСТРОЙКИ</div><h1>Профиль</h1></div></div>
<div class="profile-card"><label class="profile-label" for="displayName">Имя в архиве</label><input id="displayName" class="profile-input" maxlength="32" placeholder="Как отображать имя"><div class="muted" id="telegramName" style="font-size:10px;margin-top:8px"></div>
<label class="profile-label">Цвет интерфейса</label><div class="choice-row" id="accentChoices"><button class="swatch" data-accent="#a98dff" style="background:#a98dff"></button><button class="swatch" data-accent="#63b3ed" style="background:#63b3ed"></button><button class="swatch" data-accent="#70d6a5" style="background:#70d6a5"></button><button class="swatch" data-accent="#ff9f70" style="background:#ff9f70"></button><button class="swatch" data-accent="#f28bb8" style="background:#f28bb8"></button><button class="swatch" data-accent="#f4d06f" style="background:#f4d06f"></button></div>
<label class="profile-label">Тема</label><div class="choice-row" id="themeChoices"><button class="choice" data-theme-choice="dark">Тёмная</button><button class="choice" data-theme-choice="light">Светлая</button></div>
<label class="profile-label">Плотность карточек</label><div class="choice-row" id="densityChoices"><button class="choice" data-density-choice="comfortable">Обычная</button><button class="choice" data-density-choice="compact">Компактная</button></div>
<button class="primary" id="saveProfile">Сохранить настройки</button><div class="error" id="profileError"></div></div>
</section>
</main><section id="viewer" class="viewer hidden" aria-modal="true" role="dialog"><div class="viewer-head"><button class="smallbtn" id="viewerClose">✕ Закрыть</button><span class="viewer-name" id="viewerName"></span></div><div class="viewer-nav"><button id="viewerPrev">← Предыдущее</button><span id="viewerPosition" class="muted" style="font-size:10px"></span><button id="viewerNext">Следующее →</button></div><div class="viewer-stage" id="viewerStage"></div><div class="viewer-actions"><button id="viewerFavorite" class="favorite">♡ Избранное</button><button id="viewerSend">↗ В Telegram</button><button id="viewerDownload">↓ Открыть файл</button><button id="viewerDelete" class="danger">Удалить</button></div></section><div class="footer">ARC · PRIVATE MEDIA VAULT</div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();tg?.setHeaderColor?.('#101116');tg?.setBackgroundColor?.('#101116');
const initData=tg?.initData||'';let section='videos',page=0,total=0,allItems=[],mode='auto',loadingMore=false,hasMore=false,currentKind='',profile={display_name:'',accent:'#a98dff',theme:'dark',density:'comfortable'};let searchTimer=null;const PAGE_SIZE=12;
const $=id=>document.getElementById(id);const names={all:'Вся медиатека',favorites:'Избранное',videos:'Видео',circles:'Кружки',leaks:'Другое'};
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json','X-Telegram-Init-Data':initData,...opts.headers}});let d={};try{d=await r.json()}catch{}if(r.status===401&&d.auth_required){showLogin();throw new Error('auth')}if(!r.ok)throw new Error(d.error||'Ошибка запроса');return d}
function showLogin(){$('home').classList.add('hidden');$('library').classList.add('hidden');$('profile').classList.add('hidden');$('viewer').classList.add('hidden');document.body.style.overflow='';$('login').classList.remove('hidden')}
function showHome(){$('login').classList.add('hidden');$('library').classList.add('hidden');$('profile').classList.add('hidden');$('home').classList.remove('hidden')}
async function unlock(){const p=$('password').value;if(!p)return;$('unlock').disabled=true;try{await api('/api/unlock',{method:'POST',body:JSON.stringify({password:p})});$('password').value='';showHome();await loadHome()}catch(e){if(e.message!=='auth')$('loginError').textContent='Неверный пароль или ошибка сервера'}finally{$('unlock').disabled=false}}
$('unlock').onclick=unlock;$('password').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
async function loadHome(){try{const d=await api('/api/summary');const c=d.counts;$('count-favorites').textContent=(d.favorites||0)+' файлов';for(const k of Object.keys(c))$('count-'+k).textContent=c[k]+' файлов';$('total').textContent=Object.values(c).reduce((a,b)=>a+b,0);$('videos').textContent=c.videos;$('other').textContent=c.circles+c.leaks;$('modeLabel').textContent=d.mode==='leaks'?'Всё в другое　›':'Авто　›';mode=d.mode;if(d.user?.first_name){$('greeting').textContent='Привет, '+d.user.first_name;$('avatar').textContent=(d.user.first_name[0]||'A').toUpperCase()}try{const p=await api('/api/profile');profile=p.profile;applyProfile();if(profile.display_name){$('greeting').textContent=profile.display_name;$('avatar').textContent=profile.display_name.slice(0,1).toUpperCase()}}catch(e){}}catch(e){}}
async function openSection(s,p=0,preserveSearch=false){section=s;page=p;allItems=[];loadingMore=false;window.scrollTo(0,0);if(!preserveSearch)currentKind='';$('home').classList.add('hidden');$('library').classList.remove('hidden');$('libraryTitle').textContent=names[s];if(!preserveSearch)$('filter').value='';document.querySelectorAll('[data-kind-filter]').forEach(b=>b.classList.toggle('active',b.dataset.kindFilter===currentKind));$('files').innerHTML='<div class="empty">Загружаю коллекцию…</div>';try{const d=await api('/api/media?section='+encodeURIComponent(s)+'&page='+p+'&kind='+encodeURIComponent(currentKind)+'&q='+encodeURIComponent($('filter').value.trim()));total=d.total;allItems=d.items;if(!allItems.length&&p>0&&p*PAGE_SIZE>=total){return openSection(s,p-1,preserveSearch)}hasMore=(p+1)*PAGE_SIZE<total;$('totalLabel').textContent=total+' файлов';$('pageLabel').textContent=total+' файлов';$('prev').classList.add('hidden');$('next').classList.add('hidden');renderFiles()}catch(e){$('files').innerHTML='<div class="empty">Не удалось загрузить список. Проверь соединение и обнови страницу.</div>'}}
async function loadMore(){if(loadingMore||!hasMore)return;loadingMore=true;const nextPage=page+1;const marker=document.getElementById('loadMore');if(marker)marker.textContent='Загружаю…';try{const d=await api('/api/media?section='+encodeURIComponent(section)+'&page='+nextPage+'&kind='+encodeURIComponent(currentKind)+'&q='+encodeURIComponent($('filter').value.trim()));allItems=allItems.concat(d.items);page=nextPage;hasMore=(page+1)*PAGE_SIZE<total;renderFiles()}catch(e){if(marker)marker.textContent='Ошибка загрузки · прокрути для повтора'}finally{loadingMore=false}}
function mediaUrl(id){return '/api/media/'+id+'/file?tgWebAppData='+encodeURIComponent(initData)}
function coverUrl(id){return '/api/media/'+id+'/cover?tgWebAppData='+encodeURIComponent(initData)}
let mediaObserver=null,viewerItems=[],viewerIndex=0;
function renderFiles(){const items=allItems;if(!items.length){$('files').innerHTML='<div class="empty">Ничего не найдено</div>';return}
viewerItems=items;const cards=items.map(x=>{const kind=x.kind,id=x.id,poster=coverUrl(id),label={photo:'Фото',video:'Видео',video_note:'Видеокружок',animation:'GIF',document:'Документ'}[kind]||'Файл';let preview='';
if(kind==='photo'||(kind==='animation'&&/\\.gif$/i.test(x.file_name||'')))preview='<img class="pin-media" loading="lazy" decoding="async" src="'+poster+'" alt="Фото" onerror="this.style.display=\'none\'">';
else if(['video','video_note','animation'].includes(kind)){const shape=kind==='video_note'?' circle':'';preview='<video class="pin-preview'+shape+'" muted playsinline preload="none" poster="'+poster+'" data-preview-src="'+mediaUrl(id)+'"></video>'}
else preview='<div class="pin-cover-wrap pin-document"><div class="pin-cover-fallback"><span class="play-mark">📄</span><small>ДОКУМЕНТ</small></div></div>';
const title=(x.file_name||label).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
return '<article class="pin" data-kind="'+kind+'" data-open="'+id+'">'+preview+'<button class="pin-favorite '+(x.is_favorite?'active':'')+'" data-favorite="'+id+'" aria-label="Избранное">'+(x.is_favorite?'♥':'♡')+'</button><div class="pin-overlay"><div class="pin-title">'+title+'</div><div class="pin-actions"><button class="smallbtn" data-send="'+id+'">↗</button><button class="smallbtn delete" data-delete="'+id+'">×</button></div></div></article>'}).join('');
$('files').innerHTML='<div class="masonry">'+cards+'</div>'+(hasMore?'<div id="loadMore" class="load-more">Прокрути ниже для загрузки следующих файлов</div>':'<div class="load-more">Все файлы загружены</div>');
document.querySelectorAll('[data-open]').forEach(card=>card.onclick=e=>{if(e.target.closest('button'))return;openViewer(card.dataset.open)});
document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>delFile(b.dataset.delete));
document.querySelectorAll('[data-send]').forEach(b=>b.onclick=()=>sendFile(b.dataset.send,b));
document.querySelectorAll('[data-favorite]').forEach(b=>b.onclick=()=>toggleFavorite(b.dataset.favorite,b));
if(mediaObserver)mediaObserver.disconnect();
mediaObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{const v=entry.target;if(entry.isIntersecting){if(!v.src&&v.dataset.previewSrc){v.src=v.dataset.previewSrc;v.load()}const start=()=>{v.currentTime=0;v.play().catch(()=>{});};if(v.readyState>=1)start();else v.addEventListener('loadedmetadata',start,{once:true});v.ontimeupdate=()=>{if(v.currentTime>=2.5){v.pause();v.currentTime=0;}}}else{v.pause();}}), {rootMargin:'100px'});
document.querySelectorAll('video[data-preview-src]').forEach(v=>mediaObserver.observe(v));
}
function openViewer(id){viewerIndex=viewerItems.findIndex(x=>String(x.id)===String(id));if(viewerIndex<0)return;renderViewer();$('viewer').classList.remove('hidden');document.body.style.overflow='hidden';tg?.BackButton?.offClick?.(closeViewer);tg?.BackButton?.show?.();tg?.BackButton?.onClick?.(closeViewer)}
function renderViewer(){const x=viewerItems[viewerIndex];if(!x)return;const kind=x.kind,url=mediaUrl(x.id);$('viewerFavorite').textContent=x.is_favorite?'♥ В избранном':'♡ В избранное';$('viewerFavorite').onclick=()=>toggleFavorite(x.id,$('viewerFavorite'));const label={photo:'Фото',video:'Видео',video_note:'Видеокружок',animation:'GIF / анимация',document:'Документ'}[kind]||'Файл';$('viewerName').textContent=label;$('viewerPosition').textContent=(viewerIndex+1)+' / '+viewerItems.length;$('viewerStage').innerHTML='';let el;if(kind==='photo'||(kind==='animation'&&/\\.gif$/i.test(x.file_name||''))){el=document.createElement('img');el.src=url;el.alt=label}else if(['video','video_note','animation'].includes(kind)){el=document.createElement('video');el.src=url;el.controls=true;el.playsInline=true;el.autoplay=true;el.style.maxWidth='100%';el.style.maxHeight='100%';}else{el=document.createElement('div');el.style.textAlign='center';el.innerHTML='<div style="font-size:54px">📄</div><div style="margin-top:12px">Документ</div><div class="muted" style="font-size:11px;margin-top:6px">Откройте файл отдельно</div>'} $('viewerStage').appendChild(el);$('viewerDownload').onclick=()=>window.open(url,'_blank');$('viewerSend').onclick=()=>sendFile(x.id,$('viewerSend'));$('viewerDelete').onclick=async()=>{closeViewer();await delFile(x.id)};$('viewerPrev').disabled=viewerIndex<=0;$('viewerNext').disabled=viewerIndex>=viewerItems.length-1}
function closeViewer(){$('viewer').classList.add('hidden');$('viewerStage').innerHTML='';document.body.style.overflow='';tg?.BackButton?.offClick?.(closeViewer);tg?.BackButton?.hide?.()}
async function openProfile(){ $('home').classList.add('hidden');$('library').classList.add('hidden');$('profile').classList.remove('hidden');try{const d=await api('/api/profile');profile=d.profile; $('displayName').value=profile.display_name||'';$('telegramName').textContent='Telegram: '+(d.telegram?.first_name||'Пользователь');applyProfile();renderProfileChoices()}catch(e){$('profileError').textContent='Не удалось загрузить профиль'}}
function applyProfile(){document.documentElement.style.setProperty('--accent',profile.accent||'#a98dff');document.body.dataset.theme=profile.theme||'dark';document.body.dataset.density=profile.density||'comfortable'}
function renderProfileChoices(){document.querySelectorAll('[data-accent]').forEach(b=>b.classList.toggle('active',b.dataset.accent===profile.accent));document.querySelectorAll('[data-theme-choice]').forEach(b=>b.classList.toggle('active',b.dataset.themeChoice===profile.theme));document.querySelectorAll('[data-density-choice]').forEach(b=>b.classList.toggle('active',b.dataset.densityChoice===profile.density))}
document.querySelectorAll('[data-accent]').forEach(b=>b.onclick=()=>{profile.accent=b.dataset.accent;applyProfile();renderProfileChoices()});
document.querySelectorAll('[data-theme-choice]').forEach(b=>b.onclick=()=>{profile.theme=b.dataset.themeChoice;applyProfile();renderProfileChoices()});
document.querySelectorAll('[data-density-choice]').forEach(b=>b.onclick=()=>{profile.density=b.dataset.densityChoice;applyProfile();renderProfileChoices()});
async function saveProfile(){profile.display_name=$('displayName').value.trim().slice(0,32);$('saveProfile').disabled=true;$('profileError').textContent='';try{await api('/api/profile',{method:'POST',body:JSON.stringify(profile)});$('greeting').textContent=profile.display_name||'Личное хранилище';$('avatar').textContent=(profile.display_name||'A').slice(0,1).toUpperCase();$('profileError').textContent='Настройки сохранены'}catch(e){$('profileError').textContent=e.message||'Ошибка сохранения'}finally{$('saveProfile').disabled=false}}
$('avatar').onclick=openProfile;$('profileBtn').onclick=openProfile;$('profileBack').onclick=showHome;$('saveProfile').onclick=saveProfile;
$('viewerClose').onclick=closeViewer;$('viewer').addEventListener('click',e=>{if(e.target===$('viewer'))closeViewer()});$('viewerPrev').onclick=()=>{if(viewerIndex>0){viewerIndex--;renderViewer()}};$('viewerNext').onclick=()=>{if(viewerIndex<viewerItems.length-1){viewerIndex++;renderViewer()}};document.addEventListener('keydown',e=>{if($('viewer').classList.contains('hidden'))return;if(e.key==='Escape')closeViewer();if(e.key==='ArrowLeft')$('viewerPrev').click();if(e.key==='ArrowRight')$('viewerNext').click()});
async function sendFile(id,button){button.disabled=true;button.textContent='Отправляю…';try{await api('/api/media/'+id+'/send',{method:'POST'});tg?.HapticFeedback?.notificationOccurred?.('success');alert('Медиа отправлено в чат с ботом. Его можно переслать дальше.')}catch(e){alert(e.message==='auth'?'Сначала открой архив по паролю':'Не удалось отправить медиа в Telegram')}finally{button.disabled=false;button.textContent='↗'}}
async function toggleFavorite(id,button){const item=allItems.find(x=>String(x.id)===String(id))||viewerItems.find(x=>String(x.id)===String(id));if(!item)return;const next=!item.is_favorite;button.disabled=true;try{const d=await api('/api/media/'+id+'/favorite',{method:'POST',body:JSON.stringify({favorite:next})});item.is_favorite=d.is_favorite;allItems.forEach(x=>{if(String(x.id)===String(id))x.is_favorite=d.is_favorite});viewerItems.forEach(x=>{if(String(x.id)===String(id))x.is_favorite=d.is_favorite});if(button.id==='viewerFavorite')button.textContent=next?'♥ В избранном':'♡ В избранное';else{button.classList.toggle('active',next);button.textContent=next?'♥':'♡'}if(section==='favorites'&&!next)await openSection('favorites',0)}catch(e){alert('Не удалось изменить избранное')}finally{button.disabled=false}}
async function delFile(id){if(!confirm('Удалить файл из архива?'))return;try{await api('/api/media/'+id,{method:'DELETE'});await openSection(section,page);await loadHome()}catch(e){alert('Не удалось удалить файл')}}
document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>openSection(b.dataset.section));$('backHome').onclick=()=>{showHome();loadHome()};$('prev').onclick=()=>openSection(section,Math.max(0,page-1));$('next').onclick=()=>openSection(section,page+1);$('filter').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{const q=$('filter').value.trim().toLowerCase();const aliases={'фото':'photo','фотографии':'photo','photo':'photo','видео':'video','video':'video','гиф':'animation','gif':'animation','анимация':'animation','кружок':'video_note','кружки':'video_note','видеокружок':'video_note'};if(aliases[q]){currentKind=aliases[q];$('filter').value='';section='all';openSection('all',0,true)}else if(q){currentKind='';document.querySelectorAll('[data-kind-filter]').forEach(x=>x.classList.toggle('active',!x.dataset.kindFilter));section='all';openSection('all',0,true)}else{currentKind='';document.querySelectorAll('[data-kind-filter]').forEach(x=>x.classList.toggle('active',!x.dataset.kindFilter));openSection(section,0,true)}},280)};document.querySelectorAll('[data-kind-filter]').forEach(b=>b.onclick=()=>{currentKind=b.dataset.kindFilter;document.querySelectorAll('[data-kind-filter]').forEach(x=>x.classList.toggle('active',x===b));openSection(section,0,true)});window.addEventListener('scroll',()=>{const marker=document.getElementById('loadMore');if(marker&&marker.getBoundingClientRect().top<window.innerHeight+700)loadMore()},{passive:true});$('reloadSection').onclick=()=>openSection(section,page);$('refreshBtn').onclick=loadHome;$('modeBtn').onclick=async()=>{try{const d=await api('/api/mode',{method:'POST'});mode=d.mode;$('modeLabel').textContent=mode==='leaks'?'Всё в другое　›':'Авто　›'}catch(e){}}; 
(async()=>{if(!initData){showLogin();$('loginError').textContent='Открой приложение через кнопку в Telegram';return}try{const d=await api('/api/me');if(d.authorized){showHome();await loadHome()}else showLogin()}catch(e){if(e.message!=='auth')showLogin()}})();
</script>
