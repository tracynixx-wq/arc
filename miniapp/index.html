<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101116">
<title>ARC</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#101116;--surface:#191a22;--surface2:#22232d;--line:#2c2d38;--text:#f4f4f7;--muted:#9294a3;--accent:#a98dff;--danger:#ff7180}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 13px calc(18px + env(safe-area-inset-bottom))}
button,input{font:inherit}button{border:0;color:inherit;cursor:pointer}.top{height:54px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);margin-bottom:17px}.brand{display:flex;align-items:center;gap:9px;font-weight:850;letter-spacing:1.6px}.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(145deg,#c0aaff,#7052c8);display:grid;place-items:center;color:#171321;font-size:17px}.sub{font-size:9px;color:var(--muted);letter-spacing:1px;margin-top:2px}.avatar{width:30px;height:30px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;color:var(--accent);font-weight:700}
h1{font-size:23px;line-height:1.15;letter-spacing:-.5px;margin:3px 0 4px}.muted{color:var(--muted)}.intro{display:flex;justify-content:space-between;align-items:end}.intro .muted{font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:15px 0 18px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:10px 11px;min-width:0}.num{font-size:20px;font-weight:760;line-height:1.1}.label{font-size:9px;color:var(--muted);letter-spacing:.7px;margin-top:4px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:17px 1px 9px;font-size:13px;font-weight:750}.section-title small{font-size:11px;color:var(--muted);font-weight:450}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.tile{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:11px 9px;text-align:left;min-height:82px}.tile:active,.action:active,.smallbtn:active{transform:scale(.98)}.tile .ico{font-size:18px;margin-bottom:8px}.tile strong{display:block;font-size:12px}.tile small{display:block;color:var(--muted);font-size:10px;margin-top:3px;white-space:nowrap}
.action{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin:6px 0;text-align:left;font-size:12px}.action strong{color:var(--accent);font-weight:650}
.toolbar{display:flex;gap:7px;margin:12px 0 9px}.search{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 12px;color:var(--text);outline:none}.smallbtn{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:11px}.back{background:transparent;color:var(--accent);padding:7px 0 10px;font-weight:650;font-size:12px}
.file{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:9px;margin:7px 0;min-width:0}.thumb{width:76px;height:64px;flex:0 0 76px;border-radius:9px;background:#0b0c11;object-fit:cover}.file-main{min-width:0;flex:1}.file-name{font-size:12px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file-meta{font-size:10px;color:var(--muted);margin-top:5px}.file-actions{display:flex;gap:5px;margin-top:7px}.file-actions .smallbtn{padding:6px 8px;font-size:10px}.delete{color:var(--danger)}.preview-wrap{width:100%;margin:5px 0 0}.preview{display:block;width:100%;max-height:250px;object-fit:contain;border-radius:9px;background:#090a0d}.download{color:var(--accent);text-decoration:none;font-size:11px}
.nav{display:flex;justify-content:space-between;align-items:center;margin:13px 0}.empty{text-align:center;padding:30px 12px;color:var(--muted);font-size:12px}.hidden{display:none!important}.primary{background:var(--accent);color:#171321;font-weight:750;border-radius:11px;padding:12px;width:100%;margin-top:10px}.input{width:100%;padding:13px;border-radius:11px;background:var(--surface);border:1px solid var(--line);color:var(--text);outline:none;margin-top:15px}.error{color:var(--danger);font-size:11px;margin-top:9px}.footer{text-align:center;color:#686a78;font-size:9px;margin:22px 0 8px}
@media(min-width:520px){body{max-width:560px;margin:0 auto}.tiles{gap:9px}.tile{min-height:90px;padding:13px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="logo">A</div><div>ARC<div class="sub">PRIVATE MEDIA VAULT</div></div></div><div class="avatar" id="avatar">A</div></header>
<main id="app">
<section id="login" class="hidden"><h1>Доступ к архиву</h1><div class="muted">Введи пароль для продолжения</div><input id="password" class="input" type="password" placeholder="Пароль"><button class="primary" id="unlock">Открыть архив</button><div id="loginError" class="error"></div></section>
<section id="home">
<div class="intro"><div><div class="muted" id="greeting">Личное хранилище</div><h1>Медиатека</h1></div><div class="muted" style="font-size:10px">ЛИЧНЫЙ АРХИВ</div></div>
<div class="stats"><div class="stat"><div class="num" id="total">—</div><div class="label">ВСЕГО</div></div><div class="stat"><div class="num" id="videos">—</div><div class="label">ВИДЕО</div></div><div class="stat"><div class="num" id="other">—</div><div class="label">ДРУГОЕ</div></div></div>
<div class="section-title">Разделы <small>выбери коллекцию</small></div>
<div class="tiles">
<button class="tile" data-section="videos"><div class="ico">🎬</div><strong>Видео</strong><small id="count-videos">— файлов</small></button>
<button class="tile" data-section="circles"><div class="ico">⭕</div><strong>Кружки</strong><small id="count-circles">— файлов</small></button>
<button class="tile" data-section="leaks"><div class="ico">✦</div><strong>Другое</strong><small id="count-leaks">— файлов</small></button>
</div>
<div class="section-title">Быстрые настройки</div>
<button class="action" id="modeBtn"><span>📥 Режим сохранения</span><strong id="modeLabel">Авто　›</strong></button>
<button class="action" id="refreshBtn"><span>↻ Обновить архив</span><span class="muted">›</span></button>
</section>
<section id="library" class="hidden">
<button class="back" id="backHome">‹ Назад к медиатеке</button>
<div class="intro"><div><div class="muted" style="font-size:11px">КОЛЛЕКЦИЯ</div><h1 id="libraryTitle">Архив</h1></div><span class="muted" id="totalLabel" style="font-size:10px"></span></div>
<div class="toolbar"><input id="filter" class="search" placeholder="Поиск на странице"><button class="smallbtn" id="reloadSection">↻</button></div>
<div id="files"></div>
<div class="nav"><button class="smallbtn" id="prev">← Назад</button><span class="muted" id="pageLabel" style="font-size:10px"></span><button class="smallbtn" id="next">Далее →</button></div>
</section>
</main><div class="footer">ARC · PRIVATE MEDIA VAULT</div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();tg?.setHeaderColor?.('#101116');tg?.setBackgroundColor?.('#101116');
const initData=tg?.initData||'';let section='videos',page=0,total=0,allItems=[],mode='auto';
const $=id=>document.getElementById(id);const names={videos:'Видео',circles:'Кружки',leaks:'Другое'};
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json','X-Telegram-Init-Data':initData,...opts.headers}});let d={};try{d=await r.json()}catch{}if(r.status===401&&d.auth_required){showLogin();throw new Error('auth')}if(!r.ok)throw new Error(d.error||'Ошибка запроса');return d}
function showLogin(){$('home').classList.add('hidden');$('library').classList.add('hidden');$('login').classList.remove('hidden')}
function showHome(){$('login').classList.add('hidden');$('library').classList.add('hidden');$('home').classList.remove('hidden')}
async function unlock(){const p=$('password').value;if(!p)return;$('unlock').disabled=true;try{await api('/api/unlock',{method:'POST',body:JSON.stringify({password:p})});$('password').value='';showHome();await loadHome()}catch(e){if(e.message!=='auth')$('loginError').textContent='Неверный пароль или ошибка сервера'}finally{$('unlock').disabled=false}}
$('unlock').onclick=unlock;$('password').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
async function loadHome(){try{const d=await api('/api/summary');const c=d.counts;for(const k of Object.keys(c))$('count-'+k).textContent=c[k]+' файлов';$('total').textContent=Object.values(c).reduce((a,b)=>a+b,0);$('videos').textContent=c.videos;$('other').textContent=c.circles+c.leaks;$('modeLabel').textContent=d.mode==='leaks'?'Всё в другое　›':'Авто　›';mode=d.mode;if(d.user?.first_name){$('greeting').textContent='Привет, '+d.user.first_name;$('avatar').textContent=(d.user.first_name[0]||'A').toUpperCase()}}catch(e){}}
async function openSection(s,p=0){section=s;page=p;$('home').classList.add('hidden');$('library').classList.remove('hidden');$('libraryTitle').textContent=names[s];$('files').innerHTML='<div class="empty">Загружаю файлы…</div>';try{const d=await api('/api/media?section='+s+'&page='+p);total=d.total;allItems=d.items;$('totalLabel').textContent=total+' файлов';$('pageLabel').textContent=(p+1)+' / '+Math.max(1,Math.ceil(total/10));$('prev').disabled=p===0;$('next').disabled=(p+1)*10>=total;renderFiles()}catch(e){$('files').innerHTML='<div class="empty">Не удалось загрузить список. Проверь соединение и обнови страницу.</div>'}}
function mediaUrl(id){return '/api/media/'+id+'/file?tgWebAppData='+encodeURIComponent(initData)}
function renderFiles(){const q=$('filter').value.toLowerCase();const items=allItems.filter(x=>(x.kind+' '+x.id).toLowerCase().includes(q));if(!items.length){$('files').innerHTML='<div class="empty">Здесь пока нет файлов</div>';return}
$('files').innerHTML=items.map(x=>{const url=mediaUrl(x.id),kind=x.kind;let preview='';
if(kind==='photo')preview='<img class="thumb" loading="lazy" src="'+url+'" alt="Фото" onerror="this.outerHTML=\'<div class=&quot;thumb&quot; style=&quot;display:grid;place-items:center;color:#a98dff&quot;>Фото</div>\'">';
else if(['video','video_note','animation'].includes(kind))preview='<video class="thumb" controls playsinline preload="none" src="'+url+'" onerror="this.outerHTML=\'<div class=&quot;thumb&quot; style=&quot;display:grid;place-items:center;color:#a98dff&quot;>Видео</div>\'"></video>';
else preview='<div class="thumb" style="display:grid;place-items:center;color:#a98dff;font-size:22px">📎</div>';
const label={photo:'Фото',video:'Видео',video_note:'Видеокружок',animation:'GIF / анимация',document:'Документ'}[kind]||'Файл';
const openLink=kind==='document'?'<a class="download" href="'+url+'" target="_blank" rel="noopener">Открыть / скачать</a>':'<span class="muted" style="font-size:10px">Медиафайл</span>';
return '<article class="file">'+preview+'<div class="file-main"><div class="file-name">'+label+' №'+x.id+'</div><div class="file-meta">ARC · '+kind+'</div><div class="file-actions">'+openLink+'<button class="smallbtn delete" data-delete="'+x.id+'">Удалить</button></div></div></article>'}).join('');
document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>delFile(b.dataset.delete))}
async function delFile(id){if(!confirm('Удалить файл из архива?'))return;try{await api('/api/media/'+id,{method:'DELETE'});await openSection(section,page);await loadHome()}catch(e){alert('Не удалось удалить файл')}}
document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>openSection(b.dataset.section));$('backHome').onclick=()=>{showHome();loadHome()};$('prev').onclick=()=>openSection(section,Math.max(0,page-1));$('next').onclick=()=>openSection(section,page+1);$('filter').oninput=renderFiles;$('reloadSection').onclick=()=>openSection(section,page);$('refreshBtn').onclick=loadHome;$('modeBtn').onclick=async()=>{try{const d=await api('/api/mode',{method:'POST'});mode=d.mode;$('modeLabel').textContent=mode==='leaks'?'Всё в другое　›':'Авто　›'}catch(e){}}; 
(async()=>{if(!initData){showLogin();$('loginError').textContent='Открой приложение через кнопку в Telegram';return}try{const d=await api('/api/me');if(d.authorized){showHome();await loadHome()}else showLogin()}catch(e){if(e.message!=='auth')showLogin()}})();
</script>
</body></html>
