<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101116"><title>ARC</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#101116;--panel:#191a22;--panel2:#22232d;--text:#f4f4f7;--muted:#9294a3;--line:#2b2c37;--accent:#a78bfa;--danger:#ff6b78}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}
button,input{font:inherit}button{border:0;color:inherit;cursor:pointer}.top{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 22px}.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:2px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#b79cff,#7052c8);display:grid;place-items:center;color:#171321;font-size:21px;font-weight:900}.sub{color:var(--muted);font-size:12px;letter-spacing:0;margin-top:3px}.avatar{width:36px;height:36px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;color:var(--accent);font-weight:700}
h1{font-size:27px;margin:6px 0 5px;letter-spacing:-.7px}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:19px 0 25px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 12px}.num{font-size:23px;font-weight:750}.label{font-size:11px;color:var(--muted);margin-top:5px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:24px 2px 12px;font-weight:700}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:17px 15px;text-align:left;min-height:112px}.tile:active,.action:active{transform:scale(.98)}.tile .ico{font-size:23px;margin-bottom:12px}.tile strong{display:block;font-size:15px}.tile small{display:block;color:var(--muted);margin-top:5px}.action{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;text-align:left;margin:5px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.back{background:transparent;color:var(--accent);padding:10px 0;font-weight:650}.file{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:12px;margin:9px 0}.preview{width:100%;max-height:300px;object-fit:contain;border-radius:10px;background:#090a0d;margin-bottom:10px}.file-actions{display:flex;justify-content:flex-end;gap:8px}.smallbtn{padding:9px 12px;border-radius:10px;background:var(--panel2);font-size:13px}.delete{color:var(--danger)}.nav{display:flex;justify-content:space-between;align-items:center;margin:16px 0}.primary{background:var(--accent);color:#171321;font-weight:750;border-radius:13px;padding:14px;width:100%;margin-top:10px}.input{width:100%;padding:15px;border-radius:13px;background:var(--panel);border:1px solid var(--line);color:var(--text);outline:none;margin-top:18px}.empty{text-align:center;padding:38px 12px;color:var(--muted)}.hidden{display:none!important}.error{color:var(--danger);font-size:13px;margin-top:10px}.search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px;color:var(--text);margin:10px 0}.footer{text-align:center;color:#686a78;font-size:11px;margin:30px 0 10px}
</style></head>
<body>
<header class="top"><div class="brand"><div class="logo">A</div><div>ARC<div class="sub">PRIVATE MEDIA VAULT</div></div></div><div class="avatar" id="avatar">A</div></header>
<main id="app"><div id="login" class="hidden"><h1>Доступ к архиву</h1><div class="muted">Введи пароль для продолжения</div><input id="password" class="input" type="password" placeholder="Пароль"><button class="primary" id="unlock">Открыть хранилище</button><div id="loginError" class="error"></div></div>
<section id="home"><div class="muted" id="greeting">Личное хранилище</div><h1>Твой архив</h1><div class="muted">Все медиа в одном месте</div><div class="stats"><div class="stat"><div class="num" id="total">—</div><div class="label">ФАЙЛОВ</div></div><div class="stat"><div class="num" id="videos">—</div><div class="label">ВИДЕО</div></div><div class="stat"><div class="num" id="other">—</div><div class="label">ОСТАЛЬНОЕ</div></div></div><div class="section-title">Библиотека <span class="muted" style="font-size:12px;font-weight:400">3 раздела</span></div><div class="tiles"><button class="tile" data-section="videos"><div class="ico">🎬</div><strong>Видео</strong><small id="count-videos">Загрузка…</small></button><button class="tile" data-section="circles"><div class="ico">⭕</div><strong>Кружки</strong><small id="count-circles">Загрузка…</small></button><button class="tile" data-section="leaks"><div class="ico">✦</div><strong>Сливы</strong><small id="count-leaks">Загрузка…</small></button><button class="tile" id="searchBtn"><div class="ico">⌕</div><strong>Поиск</strong><small>Найти в архиве</small></button></div><div class="section-title">Настройки</div><button class="action row" id="modeBtn"><span>📥 Режим загрузки</span><strong id="modeLabel">Авто　›</strong></button><button class="action row" id="refreshBtn"><span>↻ Обновить данные</span><span class="muted">›</span></button></section>
<section id="library" class="hidden"><button class="back" id="backHome">‹ Главная</button><h1 id="libraryTitle">Архив</h1><div class="muted" id="librarySub"></div><input id="filter" class="search" placeholder="Поиск на этой странице"><div id="files"></div><div class="nav"><button class="smallbtn" id="prev">← Назад</button><span class="muted" id="pageLabel"></span><button class="smallbtn" id="next">Далее →</button></div></section>
</main><div class="footer">ARC · PRIVATE MEDIA VAULT</div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();tg?.setHeaderColor?.('#101116');tg?.setBackgroundColor?.('#101116');
const initData=tg?.initData||'';let section='videos',page=0,total=0,allItems=[],counts={videos:0,circles:0,leaks:0},mode='auto';
const $=id=>document.getElementById(id);const names={videos:'Видео',circles:'Кружки',leaks:'Сливы'};
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json','X-Telegram-Init-Data':initData,...opts.headers}});let d={};try{d=await r.json()}catch{}if(r.status===401&&d.auth_required){showLogin();throw new Error('auth')}if(!r.ok)throw new Error(d.error||'Ошибка запроса');return d}
function showLogin(){$('home').classList.add('hidden');$('library').classList.add('hidden');$('login').classList.remove('hidden')}
function showHome(){$('login').classList.add('hidden');$('library').classList.add('hidden');$('home').classList.remove('hidden')}
async function unlock(){const p=$('password').value;if(!p)return;$('unlock').disabled=true;try{await api('/api/unlock',{method:'POST',body:JSON.stringify({password:p})});$('password').value='';showHome();await loadHome()}catch(e){if(e.message!=='auth')$('loginError').textContent='Неверный пароль или ошибка сервера'}finally{$('unlock').disabled=false}}
$('unlock').onclick=unlock;$('password').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
async function loadHome(){try{const d=await api('/api/summary');counts=d.counts;for(const k of Object.keys(counts))$('count-'+k).textContent=counts[k]+' файлов';$('total').textContent=Object.values(counts).reduce((a,b)=>a+b,0);$('videos').textContent=counts.videos;$('other').textContent=counts.circles+counts.leaks;$('modeLabel').textContent=d.mode==='leaks'?'Всё в Сливы　›':'Авто　›';mode=d.mode;if(d.user?.first_name){$('greeting').textContent='Привет, '+d.user.first_name;$('avatar').textContent=(d.user.first_name[0]||'A').toUpperCase()}}catch(e){}}
async function openSection(s,p=0){section=s;page=p;$('home').classList.add('hidden');$('library').classList.remove('hidden');$('libraryTitle').textContent=names[s];$('librarySub').textContent='Твоя коллекция';$('files').innerHTML='<div class="empty">Загружаю архив…</div>';try{const d=await api('/api/media?section='+s+'&page='+p);total=d.total;allItems=d.items;$('pageLabel').textContent=(p+1)+' · '+Math.max(1,Math.ceil(total/10));$('prev').disabled=p===0;$('next').disabled=(p+1)*10>=total;renderFiles()}catch(e){$('files').innerHTML='<div class="empty">Не удалось загрузить архив</div>'}}
function renderFiles(){const q=$('filter').value.toLowerCase();const items=allItems.filter(x=>(x.kind+' '+x.id).toLowerCase().includes(q));if(!items.length){$('files').innerHTML='<div class="empty">В этом разделе пока нет файлов</div>';return}$('files').innerHTML=items.map(x=>{const url='/api/media/'+x.id+'/file?tgWebAppData='+encodeURIComponent(initData);let media=x.kind==='photo'?'<img class="preview" loading="lazy" src="'+url+'">':(x.kind==='video'||x.kind==='video_note')?'<video class="preview" controls playsinline preload="metadata" src="'+url+'"></video>':'<div style="padding:18px;color:#b8a4ff">📎 '+x.kind+'</div>';return '<article class="file">'+media+'<div class="row"><span class="muted">#'+x.id+'</span><button class="smallbtn delete" data-delete="'+x.id+'">Удалить</button></div></article>'}).join('');document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>delFile(b.dataset.delete))}
async function delFile(id){if(!confirm('Удалить файл из архива?'))return;try{await api('/api/media/'+id,{method:'DELETE'});await openSection(section,page);await loadHome()}catch(e){alert('Не удалось удалить файл')}}
document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>openSection(b.dataset.section));$('backHome').onclick=()=>{showHome();loadHome()};$('prev').onclick=()=>openSection(section,Math.max(0,page-1));$('next').onclick=()=>openSection(section,page+1);$('filter').oninput=renderFiles;$('refreshBtn').onclick=loadHome;$('modeBtn').onclick=async()=>{try{const d=await api('/api/mode',{method:'POST'});mode=d.mode;$('modeLabel').textContent=mode==='leaks'?'Всё в Сливы　›':'Авто　›'}catch(e){}};$('searchBtn').onclick=()=>{openSection('videos');$('filter').focus();$('filter').placeholder='Поиск по текущей странице'};
(async()=>{if(!initData){showLogin();$('loginError').textContent='Открой приложение через кнопку в Telegram';return}try{const d=await api('/api/me');if(d.authorized){showHome();await loadHome()}else showLogin()}catch(e){if(e.message!=='auth')showLogin()}})();
</script></body></html>
