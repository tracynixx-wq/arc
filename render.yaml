services:
  - type: web
    name: arc-queue-worker-staging
    runtime: docker
    plan: free
    region: frankfurt
    repo: https://github.com/tracynixx-wq/arc
    branch: arc-v1-foundation
    dockerfilePath: apps/worker/Dockerfile
    dockerContext: .
    dockerCommand: npm run start --workspace @arc/worker
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        fromService:
          type: web
          name: arc-web-staging-e03a
          envVarKey: NEXT_PUBLIC_SUPABASE_URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromService:
          type: web
          name: arc-web-staging-e03a
          envVarKey: SUPABASE_SERVICE_ROLE_KEY
